# Tuxbox: the Neutrino GUI handles the front-panel / remote power (standby) key
# itself. Depending on the "Standby-Modus" (shutdown_real) setting it enters
# flat standby (GUI keeps running) or deep standby, and on deep standby it arms
# the RTC wakeup time (/proc/stb/fp/wakeup_time) for recording timers.
#
# systemd-logind must NOT hijack the power key: its default
# HandlePowerKey=poweroff forces a hard poweroff that bypasses Neutrino. That
# both defeats the flat-standby setting and skips the RTC-wakeup arming, so the
# box can no longer wake itself for a recording timer. Hand the key to Neutrino.
#
# Refs: WORK-130, forum p=388792.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
